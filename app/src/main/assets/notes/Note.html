}
function fullCrop() { const o = board.sel; if (o) { board.cropping = fullOf(o); paint(); } }
function deleteSel() {
  if (!board.sel) return;
  remember();
  board.items = board.items.filter((o) => o !== board.sel);
  board.sel = null;
  board.cropping = null;
  paint();
  barOfBoard();
  bookChanged();
}

/** An image chosen to lay on the page in view: in its middle, not wider than half the page. */
async function bookImage(path) {
  const src = encodeURI(path), el = await loaded(src);
  const nw = (el && el.naturalWidth) || 800, nh = (el && el.naturalHeight) || 600;
  const i = pageInView(), r = canvas.getBoundingClientRect(), t = pageTop(i), pg = board.book.pages[i];
  const w = Math.min(PW * 0.55, nw), h = w * nh / nw;
  const mid = paged() ? t + pg.h / 2 : (r.height / 2 - board.view.y) / board.view.s;
  const cy = Math.max(t + h / 2 + 20, Math.min(t + pg.h - h / 2 - 20, mid));
  remember();
  const o = { src, nw, nh, cx: PW / 2, cy, w, h, rot: 0, crop: { x: 0, y: 0, w: nw, h: nh } };
  board.items.push(o);
  board.tool = "select";
  board.sel = o;
  paint();
  barOfBoard();
  bookChanged();

// ---------------------------------------------------------------- the pointer

/** What writes now: with the hand in use, what was in use before it (a pen writes all the same). */
const inkTool = () => (["pen", "marker", "shape", "eraser"].includes(board.tool) ? board.tool : board.lastInk);

function begin(e) {
  board.drawId = e.pointerId;
  const p = toBoard(e), tool = inkTool();
  if (tool === "eraser" || flipped(e)) {
    board.erased = false;
    board.now = { erasing: true };
    erase(p);
    if (board.eraser === "area") ring(e);
    return;

// ---------------------------------------------------------------- a shape drawn by hand, made true by holding the pen still

/** The line, rectangle or ellipse the points of a stroke were meant to be; null when they are none. */
function shapeOf(points) {
  if (points.length < 8) return null;
  let len = 0, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < points.length; i++) {
    const [x, y] = points[i];
    if (i) len += Math.hypot(x - points[i - 1][0], y - points[i - 1][1]);
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  const a = points[0], b = points[points.length - 1], chord = Math.hypot(b[0] - a[0], b[1] - a[1]), w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
  if (diag * board.view.s < 28) return null;
  if (chord > 0.9 * len) {
    let dev = 0;
    for (const [x, y] of points) dev = Math.max(dev, Math.abs((b[0] - a[0]) * (a[1] - y) - (a[0] - x) * (b[1] - a[1])) / chord);
    return dev < 0.07 * chord ? [a, b] : null;
  }
  if (chord > 0.3 * diag || len < 2 * diag || w < 4 || h < 4) return null;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let round = 0, square = 0;
  for (const [x, y] of points) {
    round += Math.abs(Math.hypot((x - cx) / (w / 2), (y - cy) / (h / 2)) - 1);
    square += Math.min(Math.abs(x - x0), Math.abs(x - x1), Math.abs(y - y0), Math.abs(y - y1)) / (Math.min(w, h) / 2);
  }
  round /= points.length;
  square /= points.length;
  if (Math.min(round, square) > 0.2) return null;
  return shapePoints(square < round ? "rect" : "ellipse", [x0, y0], [x1, y1]);
}

/** While a line is drawn: the pen kept still for a moment makes of it the shape it looks like. */
function holdWatch(e, s) {
  const q = local(e);
  if (board.holdRef && Math.hypot(q[0] - board.holdRef[0], q[1] - board.holdRef[1]) < 6) return;
  board.holdRef = q;
  clearTimeout(board.holdT);
  board.holdT = setTimeout(() => {
    if (board.now !== s || s.done) return;
    const made = shapeOf(s.points);
    if (!made) return;
    s.points = made;
    s.done = true;
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) { /* no vibration */ }
    paint();
  }, 550);
}

// ---------------------------------------------------------------- the notebook, or some of its pages, as a PDF

/** Page [i] as a picture [width] pixels wide. */
async function pagePicture(i, width, per) {
  const pg = board.book.pages[i], sc = width / PW;
  const need = (pg.bg ? [pg.bg.src] : []).concat(per[i].items.filter((o) => o.kind !== "text").map((o) => o.src));
  exportPics = new Map();
  for (const src of need) {
    if (exportPics.has(src)) continue;
    // On the phone a picture taken straight from its file can be drawn but not read back: it is
    // asked of the phone as data instead. One that can't be had is left out, not the whole PDF
    let el = null;
    if (host.dataUrl) {
      const url = await host.dataUrl(src);
      if (url) el = await new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = url; });
    } else el = await loaded(src);
    exportPics.set(src, el || document.createElement("canvas"));
  }
  const cv = document.createElement("canvas");
  cv.width = Math.round(width);
  cv.height = Math.round(pg.h * sc);
  const g = cv.getContext("2d");
  g.setTransform(sc, 0, 0, sc, 0, 0);
  drawSheet(g, pg, 1 / sc);
  g.beginPath();
  g.rect(0, 0, PW, pg.h);
  g.clip();
  per[i].items.forEach((o) => drawItem(g, o));
  per[i].strokes.forEach((s) => line(g, s, 0));
  exportPics = null;
  return cv;
}

/** A PDF of pictures, one a page: [pages] are { jpeg: bytes, w, h (pixels), pw, ph (points) }. */
function pdfOf(pages) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let size = 0;
  const put = (x) => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); size += b.length; };
  const obj = (n, body) => { offs[n] = size; put(n + " 0 obj\n"); body(); put("\nendobj\n"); };
  put("%PDF-1.4\n%âãÏÓ\n");
  const kids = pages.map((p, i) => (3 + i * 3) + " 0 R").join(" ");
  obj(1, () => put("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, () => put("<< /Type /Pages /Kids [" + kids + "] /Count " + pages.length + " >>"));
  pages.forEach((p, i) => {
    const n = 3 + i * 3, content = "q " + p.pw.toFixed(2) + " 0 0 " + p.ph.toFixed(2) + " 0 0 cm /Im0 Do Q";
    obj(n, () => put("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + p.pw.toFixed(2) + " " + p.ph.toFixed(2) + "] /Resources << /XObject << /Im0 " + (n + 2) + " 0 R >> >> /Contents " + (n + 1) + " 0 R >>"));
    obj(n + 1, () => put("<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream"));
    obj(n + 2, () => { put("<< /Type /XObject /Subtype /Image /Width " + p.w + " /Height " + p.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + p.jpeg.length + " >>\nstream\n"); put(p.jpeg); put("\nendstream"); });
  });
  const count = 3 + pages.length * 3, at = size;
  put("xref\n0 " + count + "\n0000000000 65535 f \n");
  for (let n = 1; n < count; n++) put(String(offs[n]).padStart(10, "0") + " 00000 n \n");
  put("trailer\n<< /Size " + count + " /Root 1 0 R >>\nstartxref\n" + at + "\n%%EOF\n");
  const out = new Uint8Array(size);
  let k = 0;
  for (const b of parts) { out.set(b, k); k += b.length; }
  return out;
}

async function exportPdf(list) {
  const b = board.book;
  if (!b) return;
  const which = (list && list.length ? list : b.pages.map((x, i) => i)).slice().sort((x, y) => x - y);
  const sh = $("sheet");
  sh.className = "on";
  sh.dataset.kind = "export";
  sh.innerHTML = "";
  const w = document.createElement("div");
  w.className = "wait";
  sh.appendChild(w);
  try {
    const per = split(), pages = [];
    for (let n = 0; n < which.length; n++) {
      w.textContent = "Preparo il PDF: pagina " + (n + 1) + " di " + which.length + "…";
      await new Promise((ok) => setTimeout(ok, 0));
      const cv = await pagePicture(which[n], 1654, per);
      const blob = await new Promise((ok) => cv.toBlob(ok, "image/jpeg", 0.86));
      if (!blob) throw new Error("pagina " + (which[n] + 1) + " troppo grande");
      pages.push({ jpeg: new Uint8Array(await blob.arrayBuffer()), w: cv.width, h: cv.height, pw: 595.28, ph: 595.28 * cv.height / cv.width });
    }
    w.textContent = "Salvo il PDF…";
    await host.exportFile((shownName || "Quaderno") + ".pdf", pdfOf(pages));
    closeSheet();
  } catch (e) {
    exportPics = null;
    closeSheet();
    say2("Non è stato possibile fare il PDF (" + ((e && (e.message || e.name)) || "errore") + ").");
  }
}

// ---------------------------------------------------------------- writing big to write small: a strip of the page, enlarged, under it

/*
 * A strip at the foot of the screen shows a piece of the page some times bigger: what is written
 * there, big and at ease, lands small and tidy on the page. The piece shown is framed on the page
 * and moved by its handle; it moves on by itself when the writing reaches its end.
 */
const ZS = 2.3;
const zcanvas = document.querySelector("#zoom canvas");

function zoomSize() { const r = zcanvas.getBoundingClientRect(); return { w: r.width / ZS, h: r.height / ZS }; }

function toggleZoom() {
  if (board.zoom) { board.zoom = null; $("zoom").classList.remove("on"); paint(); barOfBoard(); return; }
  if (!board.book) return;
  const i = pageInView(), pg = board.book.pages[i], t = pageTop(i);
  $("zoom").classList.add("on");
  const r = canvas.getBoundingClientRect(), mid = paged() ? t + pg.h * 0.2 : (r.height * 0.3 - board.view.y) / board.view.s;
  board.zoom = { page: i, x: 16, y: Math.max(t, Math.min(t + pg.h - 60, mid)) };
  fitZoom();
  barOfBoard();
}
function fitZoom() {
  const r = zcanvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (w && h && (zcanvas.width !== w || zcanvas.height !== h)) { zcanvas.width = w; zcanvas.height = h; }
  paint();
}
new ResizeObserver(() => { if (board.zoom) fitZoom(); }).observe($("zoom"));

/** The strip kept on its page, and on the page shown. */
function zoomClamp() {
  const z = board.zoom, b = board.book;
  if (!z || !b) return;
  z.page = Math.max(0, Math.min(b.pages.length - 1, z.page));
  const t = pageTop(z.page), pg = b.pages[z.page], sz = zoomSize();
  z.x = Math.max(-8, Math.min(PW - sz.w + 8, z.x));
  z.y = Math.max(t - 8, Math.min(t + pg.h - sz.h + 8, z.y));
}
function zoomStep(dx, dy, lineStart) {
  const z = board.zoom, sz = zoomSize();
  if (lineStart) z.x = 16; else z.x += dx * sz.w;
  z.y += dy * sz.h;
  zoomClamp();
  paint();
}

function paintZoom() {
  const z = board.zoom;
  if (!z || !zcanvas.width) return;
  zoomClamp();
  const g = zcanvas.getContext("2d"), k = zcanvas.width / zcanvas.getBoundingClientRect().width * ZS;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#1c2023";
  g.fillRect(0, 0, zcanvas.width, zcanvas.height);
  g.setTransform(k, 0, 0, k, -z.x * k, -z.y * k);
  const pg = board.book.pages[z.page], t = pageTop(z.page);
  g.save();
  g.translate(0, t);
  drawSheet(g, pg, 1 / ZS);
  g.restore();
  g.save();
  g.beginPath();
  g.rect(0, t, PW, pg.h);
  g.clip();
  for (const o of board.items) if (pageAt(o.cy) === z.page) drawItem(g, o);
  for (const s of board.strokes) if (pageAt(s.points[0][1]) === z.page) line(g, s, 0);
  g.restore();
}

/** The frame of the strip on the page, with its handle. */
function drawZoomFrame(g, px) {
  const z = board.zoom, sz = zoomSize();
  g.save();
  g.lineWidth = 2 * px;
  g.strokeStyle = "#1a73e8";
  g.fillStyle = "rgba(26,115,232,.07)";
  g.fillRect(z.x, z.y, sz.w, sz.h);
  g.strokeRect(z.x, z.y, sz.w, sz.h);
  const h = 26 * px;
  g.fillStyle = "#1a73e8";
  g.fillRect(z.x - px, z.y - h, h * 1.5, h);
  g.fillStyle = "#fff";
  for (const a of [0.45, 0.75, 1.05]) for (const c of [0.36, 0.66]) { g.beginPath(); g.arc(z.x + h * a, z.y - h + h * c, 1.8 * px, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
/** A press on the handle of the strip's frame: the strip is carried. */
function zoomGrab(e, raw) {
  const z = board.zoom;
  if (!z || !board.book) return false;
  const off = offOf(z.page), px = 1 / board.view.s, h = 26 * px, x = raw[0] - off[0], y = raw[1] - off[1];
  if (!(paged() ? shown().includes(z.page) : true) || x < z.x - 6 * px || x > z.x + h * 1.5 + 6 * px || y < z.y - h - 6 * px || y > z.y + 6 * px) return false;
  const from = [z.x, z.y], at = local(e);
  board.gest = { id: e.pointerId, move: (ev) => { const q = local(ev); z.x = from[0] + (q[0] - at[0]) / board.view.s; z.y = from[1] + (q[1] - at[1]) / board.view.s; zoomClamp(); paint(); }, up: () => {} };
  return true;
}

const zpoint = (e) => { const r = zcanvas.getBoundingClientRect(), z = board.zoom; return [z.x + (e.clientX - r.left) / ZS, z.y + (e.clientY - r.top) / ZS]; };
let zdraw = null;
zcanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (!board.zoom || zdraw) return;
  if (e.pointerType === "pen") board.penSeen = true;
  // With a pen about, a hand resting on the strip is nothing
  else if (e.pointerType === "touch" && board.penSeen) return;
  try { zcanvas.setPointerCapture(e.pointerId); } catch (x) { /* gone */ }
  clearTimeout(board.zoomT);
  commitText();
  const tool = inkTool(), p = zpoint(e);
  if (tool === "eraser" || flipped(e)) { board.erased = false; zdraw = { id: e.pointerId, erasing: true }; erase(p, ZS); return; }
  remember();
  const marker = tool === "marker", o = board.alpha[marker ? "marker" : "pen"];
  const s = { tool: marker ? "marker" : "pen", color: board.color, width: marker ? board.width * 4 : board.width, points: [p] };
  if (o !== (marker ? 0.35 : 1)) s.o = o;
  board.strokes.push(s);
  zdraw = { id: e.pointerId, s };
  paint();
});
zcanvas.addEventListener("pointermove", (e) => {
  if (!zdraw || zdraw.id !== e.pointerId) return;
  e.preventDefault();
  const moves = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const m of (moves.length ? moves : [e])) { if (zdraw.erasing) erase(zpoint(m), ZS); else zdraw.s.points.push(zpoint(m)); }
  if (!zdraw.erasing) paint();
});
const zlift = (e) => {
  if (!zdraw || zdraw.id !== e.pointerId) return;
  const d = zdraw;
  zdraw = null;
  paint();
  barOfBoard();
  bookChanged();
  if (d.erasing || !board.zoom) return;
  // Written up to the end of the strip: after a moment it moves on, or to the line under
  const z = board.zoom, sz = zoomSize(), last = d.s.points[d.s.points.length - 1];
  if (last[0] > z.x + sz.w * 0.78) board.zoomT = setTimeout(() => {
    if (!board.zoom || zdraw) return;
    if (z.x + sz.w >= PW - 4) zoomStep(0, 0.5, true); else zoomStep(0.6, 0);
  }, 650);
};
zcanvas.addEventListener("pointerup", zlift);
zcanvas.addEventListener("pointercancel", zlift);
for (const ev of ["touchstart", "touchmove"]) zcanvas.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
zcanvas.addEventListener("contextmenu", (e) => e.preventDefault());
{
  const side = $("zoomSide");
  const add = (html, label, run) => { const b = document.createElement("button"); b.innerHTML = html; b.title = label; b.setAttribute("aria-label", label); b.onclick = run; side.appendChild(b); };
  add(DI.left, "Più a sinistra", () => zoomStep(-0.6, 0));

  add('<svg viewBox="0 0 24 24"><path d="M20 5v7a3 3 0 0 1-3 3H5M9 11l-4 4 4 4"/></svg>', "A capo: all'inizio della riga sotto", () => zoomStep(0, 0.5, true));

// ---------------------------------------------------------------- a drawing as a file

const r1 = (n) => Math.round(n * 10) / 10;
const inkOf = (strokes) => strokes.map((s) => {
  const d = { t: s.tool, c: s.color, w: s.width, p: s.points.map(([a, b]) => [r1(a), r1(b)]) };
  if (s.o != null) d.o = s.o;
  return d;
});
const strokesFrom = (data) => data.map((s) => ({ tool: s.t || "pen", color: s.c, width: s.w, o: s.o == null ? undefined : s.o, points: s.p }));

function pathsOf(strokes) {
  return strokes.map((s) => {
    const d = s.points.map(([a, b], i) => (i ? "L" : "M") + r1(a) + " " + r1(b)).join("") + (s.points.length === 1 ? "l0.01 0" : "");
    const marker = s.tool === "marker";
    return '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + s.width + '" stroke-linecap="' + (marker ? "butt" : "round") + '" stroke-linejoin="round"' + (alphaOf(s) < 1 ? ' stroke-opacity="' + alphaOf(s) + '"' : "") + "/>";
  }).join("\n");
}

function svgOf(strokes) {
  const box = bounds(strokes), m = 16;
  const x = Math.floor(box.x - m), y = Math.floor(box.y - m), w = Math.ceil(box.w + 2 * m), h = Math.ceil(box.h + 2 * m);
  // The strokes as drawn, for the next time it is opened: written so that no character can close the tag
  const json = JSON.stringify(inkOf(strokes)).replace(/&/g, "\\u0026").replace(/</g, "\\u003c").replace(/>/g, "\\u003e");
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="' + x + " " + y + " " + w + " " + h + '">\n'
    + '<desc id="minima-strokes">' + json + "</desc>\n"
    + '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="#ffffff"/>\n' + pathsOf(strokes) + "\n</svg>\n";
}

function strokesOf(svg) {
  const m = /<desc id="minima-strokes">([\s\S]*?)<\/desc>/.exec(svg || "");
  if (!m) return null;
  try { return strokesFrom(JSON.parse(m[1])); } catch (e) { return null; }
}

async function finishDraw() {
  $("draw").classList.remove("on");
  const editing = board.editing;
  if (!board.strokes.length) {
    // Everything rubbed out: the drawing goes from the note
    if (editing) { editing.img.remove(); host.remove(editing.path); changed(); }
    else back();
    return;
  }
  const path = await host.saveText("disegno.svg", svgOf(board.strokes));
  if (!path) return;
  if (editing) {
    // A new file each time: the old picture can't come back from a cache
    setSrc(editing.img, path);
    host.remove(editing.path);
    changed();
  } else inserted("draw", path, "disegno.svg");
}

/** A tap on a drawing: opened again on the board, when it was made here. */
async function editDrawing(img) {
  const src = decodeURIComponent(srcOf(img));
  const strokes = strokesOf(await host.readText(src));
  if (!strokes) { host.open(srcOf(img)); return; }

}

// ---------------------------------------------------------------- a notebook: pages to write on by hand

let bookDirty = false;

const isBook = (html) => /<div[^>]*class="notebook"/.test(html);

/** Each page with what is on it, measured from the page's own top. */
function split() {
  const per = board.book.pages.map(() => ({ strokes: [], items: [] }));
  for (const s of board.strokes) { const i = pageAt(s.points[0][1]), t = pageTop(i); per[i].strokes.push({ ...s, points: s.points.map(([x, y]) => [x, y - t]) }); }
  for (const o of board.items) { const i = pageAt(o.cy); per[i].items.push({ ...o, crop: { ...o.crop }, cy: o.cy - pageTop(i) }); }
  return per;
}
/** The pages put back one under the other, with what is on them. */
function join(per) {
  layoutPages();
  board.strokes = [];
  board.items = [];
  per.forEach((p, i) => {
    const t = pageTop(i);
    p.strokes.forEach((s) => board.strokes.push({ ...s, points: s.points.map(([x, y]) => [x, y + t]) }));
    p.items.forEach((o) => board.items.push({ ...o, cy: o.cy + t }));
  });
}
/** A change to the pages themselves: [fn] gets the pages and what is on each, to change together. */
function rearrange(fn) {
  commitText();
  board.lsel = null;
  remember();
  const per = split();
  fn(board.book.pages, per);
  join(per);
  board.sel = null;
  board.cropping = null;
  paint();
  barOfBoard();
  bookChanged();
}

function openBook(html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  const nb = t.content.querySelector(".notebook");
  const paper = nb.getAttribute("data-paper") || "grid";
  const pages = [], per = [];
  for (const p of nb.querySelectorAll("svg.page")) {
    const vb = (p.getAttribute("viewBox") || "").trim().split(/[\s,]+/).map(Number);
    const bg = p.getAttribute("data-bg");
    const pg = { h: vb[3] > 0 ? vb[3] : PH, paper: p.getAttribute("data-paper") || paper, bg: bg ? { src: bg } : null };
    if (p.getAttribute("data-mark")) pg.mark = true;
    if (p.getAttribute("data-title")) pg.title = p.getAttribute("data-title");
    pages.push(pg);
    let strokes = [], items = [];
    try { strokes = strokesFrom(JSON.parse(p.getAttribute("data-ink") || "[]")); } catch (e) { /* a page without ink */ }
    try { items = JSON.parse(p.getAttribute("data-items") || "[]"); } catch (e) { /* nor pictures */ }
    for (const o of items) if (!o.crop) o.crop = { x: 0, y: 0, w: 1, h: 1 };
    per.push({ strokes, items });
  }
  // Always opened the same way: the pages one under the other, and the hand (a pen writes all the same)
  board.book = { paper, pages, tops: [], layout: "scroll", cur: 0 };
  if (!pages.length) { pages.push(blankPage()); per.push({ strokes: [], items: [] }); }
  board.editing = null;
  if (["pen", "marker", "shape"].includes(board.tool)) board.lastInk = board.tool;
  board.tool = "hand";
  join(per);
  startBoard(board.strokes);
  bookDirty = false;
  $("draw").classList.add("on", "book");
  board.view = { s: 0, x: 0, y: 0 };
  fit();
  whole();
}

/** Leaves the notebook, for a note of words. */
function closeBook() {
  if (!board.book) return;
  commitText();
  board.book = null;
  board.items = [];
  board.lsel = null;
  board.zoom = null;
  $("zoom").classList.remove("on");
  navOfBook();
  closeSheet();
  $("draw").classList.remove("on", "book");
  $("page").prepend(title);
}

function bookChanged() {
  if (!board.book) return;
  bookDirty = true;
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(flush, 800);
}

/** The notebook as the note keeps it: each page an SVG with its paper or picture, its images, its ink, and the same as data. */
function bookHtml() {
  const b = board.book, per = split();
  const out = b.pages.map((pg, i) => {
    let back = "";
    if (pg.bg) back = '<image href="' + esc(pg.bg.src) + '" width="' + PW + '" height="' + r1(pg.h) + '" preserveAspectRatio="none"/>';
    else {
      const paper = paperOf(pg.paper, pg.h);
      const lines = paper.lines.map(([a, c, d, e]) => "M" + a + " " + c + "L" + d + " " + e).join("");
      back = (lines ? '<path d="' + lines + '" stroke="' + (pg.paper === "lines" ? "#b9cde4" : "#d5dee8") + '" stroke-width="0.8" fill="none"/>' : "")
        + (paper.margin ? '<path d="M' + paper.margin[0] + " 0V" + r1(pg.h) + '" stroke="#f2a7a7" stroke-width="0.8"/>' : "")
        + (paper.dots.length ? '<path d="' + paper.dots.map(([x, y]) => "M" + x + " " + y + "h0.01").join("") + '" stroke="#b8c2cc" stroke-width="1.8" stroke-linecap="round"/>' : "");
    }
    const items = per[i].items.map((o) => (o.kind === "text"
      ? { kind: "text", text: o.text, size: r1(o.size), color: o.color, cx: r1(o.cx), cy: r1(o.cy), w: r1(o.w), h: r1(o.h), rot: Math.round(o.rot * 1e4) / 1e4 }
      : { src: o.src, nw: o.nw, nh: o.nh, cx: r1(o.cx), cy: r1(o.cy), w: r1(o.w), h: r1(o.h), rot: Math.round(o.rot * 1e4) / 1e4, crop: { x: r1(o.crop.x), y: r1(o.crop.y), w: r1(o.crop.w), h: r1(o.crop.h) } }));
    const pics = items.map((o) => {
      const turn = '<g transform="rotate(' + r1(o.rot * 180 / Math.PI) + " " + o.cx + " " + o.cy + ')">';
      // Words: a line of text each, so that the note opened alone shows them and a search finds them
      if (o.kind === "text") return turn + '<text font-family="sans-serif" font-size="' + o.size + '" fill="' + esc(o.color) + '" xml:space="preserve">'
        + textLines(o).map((t, n) => '<tspan x="' + r1(o.cx - o.w / 2) + '" y="' + r1(o.cy - o.h / 2 + o.size * (1.3 * n + 1)) + '">' + esc(t) + " </tspan>").join("") + "</text></g>";
      return turn + '<svg x="' + r1(o.cx - o.w / 2) + '" y="' + r1(o.cy - o.h / 2) + '" width="' + o.w + '" height="' + o.h + '" viewBox="' + o.crop.x + " " + o.crop.y + " " + o.crop.w + " " + o.crop.h + '" preserveAspectRatio="none">'
        + '<image href="' + esc(o.src) + '" width="' + o.nw + '" height="' + o.nh + '" preserveAspectRatio="none"/></svg></g>';
    }).join("");
    return '<svg class="page" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + PW + " " + r1(pg.h) + '" width="' + PW + '" height="' + r1(pg.h) + '"'
      + (pg.bg ? ' data-bg="' + esc(pg.bg.src) + '"' : ' data-paper="' + pg.paper + '"')
      + (pg.mark ? ' data-mark="1"' : "") + (pg.title ? ' data-title="' + esc(pg.title) + '"' : "")
      + ' data-ink="' + esc(JSON.stringify(inkOf(per[i].strokes))) + '"'
      + (items.length ? ' data-items="' + esc(JSON.stringify(items)) + '"' : "") + ">"
      + '<rect width="' + PW + '" height="' + r1(pg.h) + '" fill="#fff"/>' + back + pics + "\n" + pathsOf(per[i].strokes) + "</svg>";
  });
  return '<div class="notebook" data-paper="' + b.paper + '">\n' + out.join("\n") + "\n</div>";
}

/** The page in view: the one in the middle of the screen, or the one shown. */
function pageInView() {
  if (paged()) return shown()[0];
  const r = canvas.getBoundingClientRect();
  return pageAt((r.height / 2 - board.view.y) / board.view.s);
}

/** The page shown is still whole on the screen as [whole] put it: not zoomed nor moved since. */
const isFitted = () => { const f = board.fitted, v = board.view; return !!f && Math.abs(f.s - v.s) < 1e-6 && Math.abs(f.x - v.x) < 1 && Math.abs(f.y - v.y) < 1; };

function goToPage(i) {
  const b = board.book;
  // Whole on the screen before, whole after: one page may be wider or taller than the other
  if (paged()) { const fit = isFitted(); b.cur = Math.max(0, Math.min(b.pages.length - 1, i)); if (fit) whole(); else paint(); return; }
  // Room over the page for the title of its section, when it has one
  board.view.y = (b.pages[i] && b.pages[i].title ? 34 : 12) - pageTop(i) * board.view.s;
  paint();
}

/** A page on, or back: never past the last one (a new page is only made when asked for). [fitIt]: the page is put whole on the screen again. */
function turn(d, fitIt) {
  const b = board.book, n = b.pages.length;
  if (paged()) {
    const sh = shown(), step = b.layout === "double" ? 2 : 1;
    if (d > 0 && sh[sh.length - 1] === n - 1) return;
    const fit = fitIt || isFitted();
    b.cur = Math.max(0, Math.min(n - 1, sh[0] + d * step));
    board.sel = null;
    board.cropping = null;
    board.lsel = null;
    if (board.zoom) { const z = board.zoom, rel = z.y - pageTop(z.page); z.page = shown()[0]; z.y = pageTop(z.page) + rel; }
    if (fit) whole(); else paint();
    return;
  }
  const i = pageInView();
  if (d > 0 && i === n - 1) return;
  goToPage(Math.max(0, i + d));
}

function setLayout(k) {
  const b = board.book, here = pageInView();
  b.layout = k;
  board.layout = k;
  b.cur = here;
  keepPen();
  board.view = { s: 0, x: 0, y: 0 };
  whole();
  if (k === "scroll") goToPage(here);
  barOfBoard();
}

/** A new page at [at] (at the end, when not said), of [paper] or of the paper last used. */
function addPage(at, paper) {
  const k = at == null ? board.book.pages.length : at;
  if (paper) board.book.paper = paper;
  rearrange((pages, per) => { pages.splice(k, 0, blankPage()); per.splice(k, 0, { strokes: [], items: [] }); });
  goToPage(k);
}

/** The + under the pages: what kind of page, and it goes after the one in view. */
function addMenu() {
  const b = board.book, here = pageInView(), at = here + 1;
  const items = PAPERS.map(([k, label]) => ["Pagina " + (k === "blank" ? "bianca" : "a " + label.toLowerCase()) + (k === b.paper ? "  ·  come l'ultima" : ""), () => addPage(at, k)]);
  // The paper last used first: the one most likely wanted again
  items.sort((x, y) => (y[0].includes("come l'ultima") ? 1 : 0) - (x[0].includes("come l'ultima") ? 1 : 0));
  items.push(["Pagine da un PDF…", () => host.pick("pdf")]);
  items.push(["Una foto o un'immagine come pagina…", () => { board.pickAs = "page"; host.pick("image"); }]);
  items.push(["Copia di questa pagina", () => { rearrange((pages, p) => { pages.splice(at, 0, { ...pages[here] }); p.splice(at, 0, { strokes: p[here].strokes.slice(), items: p[here].items.map((o) => ({ ...o, crop: { ...o.crop } })) }); }); goToPage(at); }]);
  choose("Nuova pagina dopo la " + (here + 1), items);
}

/** A picture as a page of its own, to write over: after the page in view. */
async function imagePage(path) {
  const src = encodeURI(path), el = await loaded(src);
  const nw = (el && el.naturalWidth) || 800, nh = (el && el.naturalHeight) || 1100, at = pageInView() + 1;
  rearrange((pages, per) => { pages.splice(at, 0, { h: PW * nh / nw, paper: board.book.paper, bg: { src } }); per.splice(at, 0, { strokes: [], items: [] }); });
  goToPage(at);
}

function bookMenu() {
  const b = board.book, here = pageInView(), pg = b.pages[here];
  const items = [];
  if (!pg.bg) for (const [k, label] of PAPERS) items.push([(k === pg.paper ? "✓ " : "    ") + "Carta di questa pagina: " + label, () => rearrange((pages) => { pages[here].paper = k; b.paper = k; })]);
  for (const [k, label] of PAPERS) items.push(["    Carta di tutte le pagine: " + label, () => rearrange((pages) => { pages.forEach((p) => { p.paper = k; }); b.paper = k; })]);
  items.unshift(
    ["Indice: sezioni e segnalibri", openIndex],
    [pg.mark ? "Togli il segnalibro da questa pagina" : "Segnalibro su questa pagina", toggleMark],
    [pg.title ? "Titolo della sezione: " + pg.title : "Dai un titolo alla sezione che comincia qui", nameSection],
    ["Esporta il quaderno in PDF", () => exportPdf()],
  );
  items.push(["Elimina la pagina " + (here + 1), () => dropPage(here), true]);
  choose("Pagina " + (here + 1) + " di " + b.pages.length, items);
}

function dropPage(i) {
  rearrange((pages, per) => {
    if (pages.length === 1) { pages[0] = blankPage(); per[0] = { strokes: [], items: [] }; return; }
    pages.splice(i, 1);
    per.splice(i, 1);
  });
  goToPage(Math.min(i, board.book.pages.length - 1));
}

// ---------------------------------------------------------------- every page, small: to go to one, move, copy or take it away

function closeSheet() {
  const sh = $("sheet");
  sh.className = "";
  sh.dataset.kind = "";
  sh.innerHTML = "";
}

/** The top of a sheet over the board: a title, and buttons. */
function sheetHead(sh, heading, buttons) {
  const head = document.createElement("div");
  head.className = "shHead";
  const h = document.createElement("h2");
  h.textContent = heading;
  head.appendChild(h);
  for (const [label, run, filled, icon] of buttons) {
    const b = document.createElement("button");
    b.className = "pill" + (filled ? "" : " ghost");
    b.innerHTML = (icon ? '<span class="pi">' + icon + "</span>" : "") + "<span>" + label + "</span>";
    b.onclick = run;
    head.appendChild(b);
  }
  sh.appendChild(head);
}

function openPages() {
  const sh = $("sheet");
  sh.className = "on";
  sh.dataset.kind = "pages";
  board.pageSel = new Set();
  renderPages();
}

/**
 * Choosing many small pages by sliding over them, as in the launcher's galleries and its PDF
 * reader: a long press on one chooses it, and the finger kept down chooses every page it passes
 * to; with some already chosen a slide sideways does the same. With the mouse a press and a drag
 * is enough. Every page between the first and the one under the finger takes the first one's new
 * state; going back gives the others back theirs. Near the top or the bottom the grid scrolls.
 */
function dragSelect(grid, api) {
  let st = null;
  const at = (x, y) => { const el = document.elementFromPoint(x, y), c = el && el.closest ? el.closest(".card") : null; return c && grid.contains(c) ? +c.dataset.i : -1; };
  const start = (byHold) => {
    st.active = true;
    st.decided = true;
    st.target = !api.get(st.i);
    st.before = new Map();
    for (let k = 0; k < api.count(); k++) st.before.set(k, api.get(k));
    api.set(st.i, st.target);
    st.last = st.i;
    api.changed();
    try { grid.setPointerCapture(st.id); } catch (e) { /* gone */ }
    if (byHold && navigator.vibrate) try { navigator.vibrate(12); } catch (e) { /* no vibration */ }
  };
  grid.addEventListener("pointerdown", (e) => {
    if (e.button > 0 || (e.target.closest && e.target.closest(".grip, .acts"))) return;
    const i = at(e.clientX, e.clientY);
    if (i < 0) return;
    st = { id: e.pointerId, x: e.clientX, y: e.clientY, i, mouse: e.pointerType === "mouse", active: false, decided: false };
    clearTimeout(grid.holdTimer);
    grid.holdTimer = setTimeout(() => { if (st && !st.decided) start(true); }, 450);
  });
  grid.addEventListener("pointermove", (e) => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y, far = Math.hypot(dx, dy);
    if (!st.decided) {
      if (st.mouse && far > 6) start(false);
      else if (!st.mouse && api.going() && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) start(false);
      else if (far > 10) { st.decided = true; clearTimeout(grid.holdTimer); }
    }
    if (!st.active) return;
    e.preventDefault();
    const j = at(e.clientX, e.clientY);
    if (j >= 0 && j !== st.last) {
      st.last = j;
      const a = Math.min(st.i, j), b = Math.max(st.i, j);
      for (let k = 0; k < api.count(); k++) api.set(k, k >= a && k <= b ? st.target : st.before.get(k));
      api.changed();
    }
    const r = grid.getBoundingClientRect();
    if (e.clientY < r.top + 50) grid.scrollTop -= 14;
    else if (e.clientY > r.bottom - 50) grid.scrollTop += 14;
  });
  const end = (e) => {
    if (!st || e.pointerId !== st.id) return;
    clearTimeout(grid.holdTimer);
    if (st.active) grid.dataset.swallow = "1";
    st = null;
  };
  grid.addEventListener("pointerup", end);
  grid.addEventListener("pointercancel", end);
  // Once a slide has begun, the grid no longer scrolls under the finger
  grid.addEventListener("touchmove", (e) => { if (st && st.active) e.preventDefault(); }, { passive: false });
  // The click after a slide is not a tap
  grid.addEventListener("click", (e) => { if (grid.dataset.swallow) { grid.dataset.swallow = ""; e.stopPropagation(); e.preventDefault(); } }, true);
  grid.addEventListener("contextmenu", (e) => e.preventDefault());
}

/** The pages in a new order: [moved] (indexes) put before what is now page [t]. */
function movePages(moved, t) {
  const n = board.book.pages.length, rest = [];
  for (let k = 0; k < n; k++) if (!moved.includes(k)) rest.push(k);
  const pos = rest.filter((k) => k < t).length, order = rest.slice(0, pos).concat(moved, rest.slice(pos));
  if (order.every((k, i) => k === i)) return;
  rearrange((pages, per) => {
    const P = pages.slice(), Q = per.slice();
    order.forEach((k, i) => { pages[i] = P[k]; per[i] = Q[k]; });
  });
  board.pageSel = new Set(moved.map((x, i) => pos + i));
}

/** A page taken by its grip and carried, with the others chosen if it is one of them, to where it is let go. */
function carryPages(e, i, grid) {
  e.preventDefault();
  e.stopPropagation();
  const sel = board.pageSel, moved = sel.has(i) ? Array.from(sel).sort((a, b) => a - b) : [i];
  const ghost = document.createElement("div");
  ghost.className = "carry";
  const src = grid.querySelector('.card[data-i="' + i + '"] canvas');
  if (src) { const c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.getContext("2d").drawImage(src, 0, 0); c.style.width = "110px"; ghost.appendChild(c); }
  if (moved.length > 1) { const n = document.createElement("span"); n.textContent = moved.length; ghost.appendChild(n); }
  document.body.appendChild(ghost);
  const line = document.createElement("div");
  line.className = "dropline";
  grid.appendChild(line);
  let t = -1;
  const follow = (ev) => {
    ghost.style.left = ev.clientX - 55 + "px";
    ghost.style.top = ev.clientY - 30 + "px";
    let best = null, bd = Infinity;
    grid.querySelectorAll(".card").forEach((c) => {
      const r = c.getBoundingClientRect(), d = Math.hypot(ev.clientX - (r.left + r.width / 2), ev.clientY - (r.top + r.height / 2));
      if (d < bd) { bd = d; best = c; }
    });
    if (best) {
      const r = best.getBoundingClientRect(), g = grid.getBoundingClientRect(), after = ev.clientX > r.left + r.width / 2;
      t = +best.dataset.i + (after ? 1 : 0);
      line.style.left = (after ? r.right + 5 : r.left - 9) - g.left + grid.scrollLeft + "px";
      line.style.top = r.top - g.top + grid.scrollTop + "px";
      line.style.height = r.height + "px";
    }
    const gr = grid.getBoundingClientRect();
    if (ev.clientY < gr.top + 60) grid.scrollTop -= 16;
    else if (ev.clientY > gr.bottom - 60) grid.scrollTop += 16;
  };
  follow(e);
  const target = e.currentTarget;
  try { target.setPointerCapture(e.pointerId); } catch (x) { /* gone */ }
  const move = (ev) => { if (ev.pointerId === e.pointerId) { ev.preventDefault(); follow(ev); } };
  const up = (ev) => {
    if (ev.pointerId !== e.pointerId) return;
    target.removeEventListener("pointermove", move);
    target.removeEventListener("pointerup", up);
    target.removeEventListener("pointercancel", up);
    ghost.remove();
    line.remove();
    if (ev.type === "pointerup" && t >= 0) movePages(moved, t);
    renderPages();
  };
  target.addEventListener("pointermove", move);
  target.addEventListener("pointerup", up);
  target.addEventListener("pointercancel", up);
}

function renderPages() {
  const sh = $("sheet"), b = board.book;
  if (!b) return;
  const old = sh.querySelector(".grid"), scroll = old ? old.scrollTop : 0;
  sh.innerHTML = "";
  const here = pageInView(), per = split(), sel = board.pageSel;
  for (const k of Array.from(sel)) if (k >= b.pages.length) sel.delete(k);
  const chosen = () => Array.from(sel).sort((x, y) => x - y);
  if (sel.size) sheetHead(sh, sel.size === 1 ? "1 pagina scelta" : sel.size + " pagine scelte", [
    ["Duplica", () => {
      const list = chosen();
      rearrange((pages, p) => {
        for (let n = list.length - 1; n >= 0; n--) {
          const k = list[n];
          pages.splice(k + 1, 0, { ...pages[k] });
          p.splice(k + 1, 0, { strokes: p[k].strokes.slice(), items: p[k].items.map((o) => ({ ...o, crop: { ...o.crop } })) });
        }
      });
      sel.clear();
      renderPages();
    }, false, DI.copy],
    ["Elimina", () => {
      const list = chosen();
      rearrange((pages, p) => {
        for (let n = list.length - 1; n >= 0; n--) { pages.splice(list[n], 1); p.splice(list[n], 1); }
        if (!pages.length) { pages.push(blankPage()); p.push({ strokes: [], items: [] }); }
      });
      sel.clear();
      renderPages();
    }, false, DI.trash],
    ["PDF", () => exportPdf(chosen()), false, DI.pdf],
    ["Tutte", () => { b.pages.forEach((x, k) => sel.add(k)); renderPages(); }],
    ["Fatto", () => { sel.clear(); renderPages(); }, true],
  ]);
  else sheetHead(sh, "Pagine · " + b.pages.length, [
    [board.onlyMarks ? "Tutte le pagine" : "Solo segnalibri", () => { board.onlyMarks = !board.onlyMarks; renderPages(); }, false, DI.mark],
    ["Pagina", () => { addPage(); renderPages(); }, false, DI.page],
    ["Da PDF", () => host.pick("pdf"), false, DI.pdf],
    ["Chiudi", closeSheet, true],
  ]);
  const hint = document.createElement("div");
  hint.className = "shHint";
  hint.textContent = "Tieni premuto e trascina per sceglierne più d'una · trascina ⠿ per spostarle";
  sh.appendChild(hint);
  const grid = document.createElement("div");
  grid.className = "grid";
  sh.appendChild(grid);
  const dpr = Math.min(window.devicePixelRatio || 1, 2), width = 150, sc = width / PW;
  b.pages.forEach((pg, i) => {
    const card = document.createElement("div");
    card.className = "card" + (i === here ? " here" : "") + (sel.has(i) ? " chosen" : "");
    card.dataset.i = i;
    const cv = document.createElement("canvas");
    cv.width = Math.round(width * dpr);
    cv.height = Math.round(pg.h * sc * dpr);
    cv.style.width = width + "px";
    cv.style.height = Math.round(pg.h * sc) + "px";
    const g = cv.getContext("2d");
    g.setTransform(sc * dpr, 0, 0, sc * dpr, 0, 0);
    drawSheet(g, pg, 1 / (sc * dpr));
    g.save();
    g.beginPath();
    g.rect(0, 0, PW, pg.h);
    g.clip();
    per[i].items.forEach((o) => drawItem(g, o));
    per[i].strokes.forEach((s) => line(g, s, 0));
    g.restore();
    card.onclick = () => {
      if (sel.size) { if (sel.has(i)) sel.delete(i); else sel.add(i); renderPages(); return; }
      closeSheet();
      goToPage(i);
    };
    card.title = "Vai alla pagina " + (i + 1);
    const grip = document.createElement("button");
    grip.className = "grip";
    grip.innerHTML = DI.grip;
    grip.title = "Trascina per spostare";
    grip.setAttribute("aria-label", "Sposta la pagina " + (i + 1));
    grip.onpointerdown = (e) => carryPages(e, i, grid);
    grip.onclick = (e) => e.stopPropagation();
    const tick = document.createElement("div");
    tick.className = "tick";
    tick.innerHTML = DI.check;
    const num = document.createElement("div");
    num.className = "num";
    num.textContent = i + 1;
    const acts = document.createElement("div");
    acts.className = "acts";
    const act = (icon, label, run) => {
      const a = document.createElement("button");
      a.className = "ib";
      a.innerHTML = icon;
      a.title = label;
      a.setAttribute("aria-label", label);
      a.onclick = (e) => { e.stopPropagation(); run(); renderPages(); };
      acts.appendChild(a);
    };
    act(DI.page, "Pagina vuota dopo questa", () => rearrange((pages, p) => { pages.splice(i + 1, 0, blankPage()); p.splice(i + 1, 0, { strokes: [], items: [] }); }));
    act(DI.copy, "Duplica", () => rearrange((pages, p) => { pages.splice(i + 1, 0, { ...pages[i] }); p.splice(i + 1, 0, { strokes: p[i].strokes.slice(), items: p[i].items.map((o) => ({ ...o, crop: { ...o.crop } })) }); }));
    act(DI.trash, "Elimina", () => rearrange((pages, p) => {
      if (pages.length === 1) { pages[0] = blankPage(); p[0] = { strokes: [], items: [] }; return; }
      pages.splice(i, 1);
      p.splice(i, 1);
    }));
    card.append(cv, grip, tick, num);
    if (pg.title) { const t = document.createElement("div"); t.className = "sect"; t.textContent = pg.title; card.appendChild(t); }
    if (pg.mark) { const r = document.createElement("div"); r.className = "ribbon"; card.appendChild(r); }
    card.appendChild(acts);
    // Only the marked pages and the ones a section begins at, when asked
    if (board.onlyMarks && !sel.size && !pg.mark && !pg.title) card.style.display = "none";
    grid.appendChild(card);
  });
  dragSelect(grid, {
    count: () => b.pages.length,
    get: (k) => sel.has(k),
    set: (k, v) => { if (v) sel.add(k); else sel.delete(k); },
    changed: () => {
      grid.querySelectorAll(".card").forEach((c) => c.classList.toggle("chosen", sel.has(+c.dataset.i)));
      const h = sh.querySelector(".shHead h2");
      // The head changes between "pages" and "chosen": drawn again when the slide ends
      if (h && !!sel.size !== h.textContent.includes("scelt")) grid.dataset.redraw = "1";
    },
    going: () => sel.size > 0,
  });
  grid.addEventListener("pointerup", () => { if (grid.dataset.redraw) setTimeout(renderPages, 0); });
  grid.scrollTop = scroll;
}

/** A PDF chosen ([source]: its path on the phone, the file itself on a computer): which of its pages to take. */
async function pdfChosen(source, name) {
  if (!board.book) return;
  const sh = $("sheet");
  sh.className = "on";
  sh.dataset.kind = "pdf";
  sh.innerHTML = "";
  const wait = document.createElement("div");
  wait.className = "wait";
  wait.textContent = "Apro il PDF…";
  sh.appendChild(wait);
  let count = 0;
  try { count = await host.pdfOpen(source); } catch (e) { count = 0; }
  if (sh.dataset.kind !== "pdf") return;
  if (!(count > 0)) { wait.textContent = android ? "Questo PDF non si apre." : "Questo PDF non si apre (sul computer per leggerlo serve la connessione a internet)."; return; }
  const chosen = new Set(Array.from({ length: count }, (x, i) => i));
  sh.innerHTML = "";
  const head = () => {
    const old = sh.querySelector(".shHead");
    if (old) old.remove();
    sheetHead(sh, (name || "PDF") + " · " + chosen.size + " di " + count, [
      ["Tutte", () => { chosen.clear(); for (let i = 0; i < count; i++) chosen.add(i); ticks(); }],
      ["Nessuna", () => { chosen.clear(); ticks(); }],
      ["Annulla", closeSheet],
      ["Inserisci " + chosen.size, take, true],
    ]);
    sh.prepend(sh.querySelector(".shHead"));
  };
  const grid = document.createElement("div");
  grid.className = "grid";
  const cards = [];
  for (let i = 0; i < count; i++) {
    const card = document.createElement("div");
    card.className = "card pick";
    card.dataset.i = i;
    const im = document.createElement("img");
    im.alt = "";
    const num = document.createElement("div");
    num.className = "num";
    num.textContent = i + 1;
    const tick = document.createElement("div");
    tick.className = "tick";
    tick.innerHTML = DI.check;
    card.append(im, num, tick);
    card.onclick = () => { if (chosen.has(i)) chosen.delete(i); else chosen.add(i); ticks(); };
    grid.appendChild(card);
    cards.push({ card, im });
  }
  function ticks() { cards.forEach(({ card }, i) => card.classList.toggle("on", chosen.has(i))); head(); }
  sh.appendChild(grid);
  dragSelect(grid, { count: () => count, get: (k) => chosen.has(k), set: (k, v) => { if (v) chosen.add(k); else chosen.delete(k); }, changed: ticks, going: () => true });
  ticks();
  async function take() {
    const list = Array.from(chosen).sort((a, b) => a - b);
    if (!list.length) return;
    sh.dataset.kind = "taking";
    sh.innerHTML = "";
    const w = document.createElement("div");
    w.className = "wait";
    sh.appendChild(w);
    const got = [];
    for (let n = 0; n < list.length; n++) {
      w.textContent = "Metto nel quaderno la pagina " + (n + 1) + " di " + list.length + "…";
      await new Promise((ok) => setTimeout(ok, 0));
      try { const p = await host.pdfPage(list[n]); if (p && p.src) got.push(p); } catch (e) { /* that page is left out */ }
    }
    closeSheet();
    if (!got.length) { say2("Non è stato possibile prendere le pagine del PDF."); return; }
    // After the page in view; in place of the first one, when the notebook is still empty
    const per0 = split(), empty = board.book.pages.length === 1 && !board.book.pages[0].bg && !per0[0].strokes.length && !per0[0].items.length;
    const at = empty ? 0 : pageInView() + 1;
    rearrange((pages, per) => {
      if (empty) { pages.splice(0, 1); per.splice(0, 1); }
      got.forEach((p, n) => {
        pages.splice(at + n, 0, { h: PW * p.h / p.w, paper: board.book.paper, bg: { src: encodeURI(p.src) } });
        per.splice(at + n, 0, { strokes: [], items: [] });
      });
    });
    goToPage(at);
  }
  // Small pictures of the pages, one after the other, while they can already be chosen
  for (let i = 0; i < count; i++) {
    if (sh.dataset.kind !== "pdf") return;
    try { cards[i].im.src = await host.pdfThumb(i); } catch (e) { /* left blank */ }
  }
}

/** Back, on the phone: a window open over the note closes first. True when there was one. */
function goBack() {
  if ($("veil").classList.contains("on")) { $("veil").classList.remove("on"); $("box").classList.remove("picker"); return true; }
  if ($("sheet").classList.contains("on")) { closeSheet(); return true; }
  if (commitText()) return true;
  if (clearLasso()) { paint(); barOfBoard(); return true; }
  if (board.cropping) { board.cropping = null; paint(); barOfBoard(); return true; }
  if (board.sel && $("draw").classList.contains("on")) { board.sel = null; paint(); barOfBoard(); return true; }
  if ($("draw").classList.contains("on") && !board.book) { $("draw").classList.remove("on"); return true; }
  return false;
}

const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
const pc = { root: null, tree: null, pins: [], open: null, blobs: new Map(), shut: new Set(JSON.parse(localStorage.getItem("shut") || "[]")) };

const idb = (mode, run) => new Promise((ok, no) => {
  const r = indexedDB.open("note", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onerror = () => no(r.error);
  r.onsuccess = () => {
    try { const q = run(r.result.transaction("kv", mode).objectStore("kv")); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }
    catch (e) { no(e); }
  };
});

async function dirOf(path, create) {
  let d = pc.root;
  for (const part of path) d = await d.getDirectoryHandle(part, { create: !!create });
  return d;
}
async function readText(dir, name) { return (await (await dir.getFileHandle(name)).getFile()).text(); }
async function writeFile(dir, name, data) {
  const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
  await w.write(data);
  await w.close();
}
async function freeName(dir, wanted) {
  const dot = wanted.lastIndexOf("."), stem = dot > 0 ? wanted.slice(0, dot) : wanted, ext = dot > 0 ? wanted.slice(dot) : "";
  for (let i = 1; ; i++) {
    const name = i === 1 ? wanted : stem + " " + i + ext;
    try { await dir.getFileHandle(name); } catch (e) { try { await dir.getDirectoryHandle(name); } catch (e2) { return name; } }
  }
}

async function scan(dir, path) {
  const node = { name: path[path.length - 1] || "", path, folders: [], notes: [] };
  for await (const [name, h] of dir.entries()) {
    if (HIDDEN(name)) continue;
    if (h.kind === "directory") node.folders.push(await scan(h, path.concat(name)));
    else if (/\.html?$/i.test(name) && !(path.length === 0 && name === "Note.html")) {
      const f = await h.getFile();
      // A notebook says so near its start
      let book = false;
      try { book = isBook(await f.slice(0, 6000).text()); } catch (e) { /* a note */ }
      node.notes.push({ name: name.replace(/\.html?$/i, ""), file: name, path, time: f.lastModified, book });
    }
  }
  node.folders.sort((a, b) => a.name.localeCompare(b.name));
  node.notes.sort((a, b) => b.time - a.time);
  return node;
}

async function reload() {
  pc.tree = await scan(pc.root, []);
  try { pc.pins = JSON.parse(await readText(pc.root, "_note.json")).pinned || []; } catch (e) { pc.pins = []; }
  // Kept for the next opening: the tree shows at once, before the browser lets the folder be read again
  try { localStorage.setItem("tree", JSON.stringify({ root: pc.root.name, tree: pc.tree, pins: pc.pins })); } catch (e) { /* too big, or not allowed */ }
  draw();
}
const keyOf = (n) => n.path.concat(n.file).join("/");
const savePins = () => writeFile(pc.root, "_note.json", JSON.stringify({ pinned: pc.pins }, null, 1));

function draw() {
  const tree = $("tree"), q = $("filter").value.trim().toLowerCase();
  tree.innerHTML = "";
  const all = [];
  (function walk(n) { n.notes.forEach((x) => all.push(x)); n.folders.forEach(walk); })(pc.tree);
  const row = (cls, depth, label, onClick, onMore, extra) => {
    const r = document.createElement("div");
    r.className = "row " + cls;
    r.style.paddingLeft = (8 + depth * 18) + "px";
    r.innerHTML = extra || "";
    const n = document.createElement("div");
    n.className = "name";
    n.textContent = label;
    r.appendChild(n);
    const m = document.createElement("button");
    m.className = "more";
    m.textContent = "⋯";
    m.setAttribute("aria-label", "Altro");
    m.onclick = (e) => { e.stopPropagation(); onMore(); };
    r.appendChild(m);
    r.onclick = onClick;
    r.oncontextmenu = (e) => { e.preventDefault(); onMore(); };
    tree.appendChild(r);
    return r;
  };
  // A note or a folder taken with the mouse, and the folders it can be let go on
  const drag = (r, what) => {
    r.draggable = true;
    r.addEventListener("dragstart", (e) => { pc.drag = what; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", what.name); });
    r.addEventListener("dragend", () => { pc.drag = null; document.querySelectorAll(".drop").forEach((x) => x.classList.remove("drop")); });
  };
  const target = (r, path) => {
    r.addEventListener("dragover", (e) => { if (pc.drag) { e.preventDefault(); e.stopPropagation(); r.classList.add("drop"); } });
    r.addEventListener("dragleave", () => r.classList.remove("drop"));
    r.addEventListener("drop", (e) => { if (!pc.drag) return; e.preventDefault(); e.stopPropagation(); r.classList.remove("drop"); moveTo(pc.drag, path); });
  };
  const note = (n, depth, pinned) => {
    const r = row("note", depth, n.name, () => openNote(n), () => noteMenu(n), pinned ? '<span class="pin">★</span>' : '<span class="chev"></span>');
    const k = document.createElement("span");
    k.className = "kind";
    k.title = n.book ? "Quaderno" : "Nota";
    k.innerHTML = n.book ? KIND_BOOK : KIND_NOTE;
    r.insertBefore(k, r.querySelector(".more"));
    if (pc.open && keyOf(pc.open) === keyOf(n)) r.classList.add("on");
    drag(r, { kind: "note", note: n, name: n.name });
    // Let go on a note: beside it, in its folder
    target(r, n.path);
  };
  if (q) { all.filter((n) => n.name.toLowerCase().includes(q)).forEach((n) => note(n, 0, false)); return; }
  all.filter((n) => pc.pins.includes(keyOf(n))).forEach((n) => note(n, 0, true));
  (function walk(n, depth) {
    for (const f of n.folders) {
      const key = f.path.join("/"), shut = pc.shut.has(key);
      const fr = row("folder", depth, f.name, () => { if (shut) pc.shut.delete(key); else pc.shut.add(key); localStorage.setItem("shut", JSON.stringify(Array.from(pc.shut))); draw(); },
        () => folderMenu(f), '<span class="chev">' + (shut ? "▸" : "▾") + "</span>");
      drag(fr, { kind: "folder", folder: f, name: f.name });
      target(fr, f.path);
      if (!shut) walk(f, depth + 1);
    }
    n.notes.filter((x) => !pc.pins.includes(keyOf(x))).forEach((x) => note(x, depth, false));
  })(pc.tree, 0);
}
$("filter").addEventListener("input", () => { if (pc.tree) draw(); });

/** The files of the `_allegati` folder a note's page links to. */
function carried(text) {
  const out = new Set();
  for (const m of text.matchAll(/(?:src|href)="_allegati\/([^"]+)"/g)) { try { out.add(decodeURIComponent(m[1])); } catch (e) { out.add(m[1]); } }
  return Array.from(out);
}

async function copyDir(src, dst) {
  for await (const [name, h] of src.entries()) {
    if (h.kind === "directory") await copyDir(h, await dst.getDirectoryHandle(name, { create: true }));
    else await writeFile(dst, name, await h.getFile());
  }
}

/** Moves a note (with its files) or a whole folder into the folder at [path]. */
async function moveTo(what, path) {
  pc.drag = null;
  try {
    flush();
    if (what.kind === "note") {
      const n = what.note;
      if (n.path.join("/") === path.join("/")) return;
      const from = await dirOf(n.path), to = await dirOf(path);
      const text = await readText(from, n.file);
      const file = await freeName(to, n.file);
      await writeFile(to, file, text);
      const names = carried(text);
      if (names.length) {
        const fromFiles = await from.getDirectoryHandle(FILES), toFiles = await to.getDirectoryHandle(FILES, { create: true });
        for (const name of names) {
          try {
            const f = await (await fromFiles.getFileHandle(name)).getFile();
            try { await toFiles.getFileHandle(name); } catch (e) { await writeFile(toFiles, name, f); await fromFiles.removeEntry(name); }
          } catch (e) { /* a link to a file no longer there */ }
        }
      }
      await from.removeEntry(n.file);
      const old = keyOf(n), moved = { name: file.replace(/\.html?$/i, ""), file, path, time: Date.now() };
      if (pc.pins.includes(old)) { pc.pins = pc.pins.map((p) => (p === old ? keyOf(moved) : p)); await savePins(); }
      const wasOpen = pc.open && keyOf(pc.open) === old;
      await reload();
      if (wasOpen) await openNote(moved);
    } else {
      const f = what.folder, own = f.path.join("/"), dest = path.join("/");
      // Into itself or one of its own folders: nowhere to go
      if (f.path.slice(0, -1).join("/") === dest || dest === own || dest.startsWith(own + "/")) return;
      const to = await dirOf(path);
      try { await to.getDirectoryHandle(f.name); say2("Lì c'è già una cartella \"" + f.name + "\"."); return; } catch (e) { /* free */ }
      await copyDir(await dirOf(f.path), await to.getDirectoryHandle(f.name, { create: true }));
      await (await dirOf(f.path.slice(0, -1))).removeEntry(f.name, { recursive: true });
      const moved = path.concat(f.name).join("/");
      pc.pins = pc.pins.map((p) => (p.startsWith(own + "/") ? moved + p.slice(own.length) : p));
      await savePins();
      const wasOpen = pc.open && pc.open.path.join("/").startsWith(own);
      if (wasOpen) pc.open.path = path.concat(f.name).concat(pc.open.path.slice(f.path.length));
      await reload();
      if (wasOpen) await openNote(pc.open);
    }
  } catch (e) { say2("Non è stato possibile spostarla."); }
}

function say2(text) { choose(text, [["OK", () => {}]]); }

async function openNote(n) {
  if (pc.gate) await pc.gate;

const pcHost = {
  save: async (page) => { const n = pc.open; if (n) await writeFile(await dirOf(n.path), n.file, page); },
  rename: async (name) => {
    const n = pc.open, dir = await dirOf(n.path), file = await freeName(dir, name + ".html");
    const old = keyOf(n);
    await writeFile(dir, file, await readText(dir, n.file));
    await dir.removeEntry(n.file);
    n.file = file;
    n.name = file.replace(/\.html$/, "");
    if (pc.pins.includes(old)) { pc.pins = pc.pins.map((p) => (p === old ? keyOf(n) : p)); await savePins(); }
    await reload();
    return n.name;
  },
  pick: (kind) => {
    const i = document.createElement("input");
    i.type = "file";
    if (kind === "image") i.accept = "image/*";
    if (kind === "pdf") i.accept = "application/pdf,.pdf";
    i.onchange = async () => {
      const f = i.files[0];
      if (!f) return;
      if (kind === "pdf") { pdfChosen(f, f.name.replace(/\.pdf$/i, "")); return; }
      const dir = await (await dirOf(pc.open.path)).getDirectoryHandle(FILES, { create: true });
      const name = await freeName(dir, f.name);
      await writeFile(dir, name, f);
      inserted(kind, FILES + "/" + name, f.name);
    };
    i.click();
  },
  saveData: async (name, data) => {
    const dir = await (await dirOf(pc.open.path)).getDirectoryHandle(FILES, { create: true });
    const file = await freeName(dir, name);
    await writeFile(dir, file, await (await fetch(data)).blob());
    return FILES + "/" + file;
  },
  /** A file beside the open note, from the folder itself. */
  file: async (href) => {
    let path = href;
    try { path = decodeURIComponent(href); } catch (e) { /* written plain */ }
    const parts = path.split("/").filter((x) => x && x !== ".");
    const dir = await dirOf(pc.open.path.concat(parts.slice(0, -1)));
    return (await dir.getFileHandle(parts[parts.length - 1])).getFile();
  },
  blob: async (href) => {
    const key = (pc.open ? keyOf(pc.open) : "") + "|" + href;
    if (pc.blobs.has(key)) return pc.blobs.get(key);
    try { const url = URL.createObjectURL(await pcHost.file(href)); pc.blobs.set(key, url); return url; } catch (e) { return null; }
  },
  /** A PDF read by pdf.js, fetched the first time it is needed. */
  pdfOpen: async (file) => {
    if (!window.pdfjsLib) {
      await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = PDFJS + "pdf.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
    }
    pc.pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    return pc.pdf.numPages;
  },
  pdfDraw: async (i, width) => {
    const page = await pc.pdf.getPage(i + 1), base = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: width / base.width });
    const cv = document.createElement("canvas");
    cv.width = Math.round(vp.width);
    cv.height = Math.round(vp.height);
    const g = cv.getContext("2d");
    g.fillStyle = "#fff";
    g.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: g, viewport: vp }).promise;
    return { cv, w: base.width, h: base.height };
  },
  pdfThumb: async (i) => (await pcHost.pdfDraw(i, 160)).cv.toDataURL("image/jpeg", 0.7),
  pdfPage: async (i) => {
    const { cv, w, h } = await pcHost.pdfDraw(i, 1600);
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/jpeg", 0.88));
    const dir = await (await dirOf(pc.open.path)).getDirectoryHandle(FILES, { create: true });
    const name = await freeName(dir, "pagina pdf.jpg");
    await writeFile(dir, name, blob);
    return { src: FILES + "/" + name, w, h };
  },
  open: async (href) => {
    if (!/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) { const url = await pcHost.blob(href); if (url) { window.open(url, "_blank", "noopener"); return; } }
    window.open(new URL(href, document.baseURI).href, "_blank", "noopener");
  },
  readText: async (path) => {
    try {
      const parts = path.split("/").filter((x) => x && x !== ".");
      return await readText(await dirOf(pc.open.path.concat(parts.slice(0, -1))), parts[parts.length - 1]);
    } catch (e) { return ""; }
  },
  saveText: async (name, text) => {
    const dir = await (await dirOf(pc.open.path)).getDirectoryHandle(FILES, { create: true });
    const file = await freeName(dir, name);
    await writeFile(dir, file, text);
    return FILES + "/" + file;
  },
  remove: async (path) => {
    try {
      const parts = path.split("/").filter((x) => x && x !== ".");
      if (parts[0] !== FILES || parts.length !== 2) return;
      await (await dirOf(pc.open.path.concat(FILES))).removeEntry(parts[1]);
    } catch (e) { /* already gone */ }
  },
  exportFile: async (name, bytes) => {
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  },
  // On a computer: a copy where the browser keeps what is downloaded
  share: async (href, name) => {
    try {
      const file = await pcHost.file(href);
      const url = URL.createObjectURL(file);
      const a = document.createElement("a");
      a.href = url;
      a.download = name || file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) { pcHost.open(href); }
  },
};

/** The list of the notes, hidden for a note on the whole screen, or shown again. */
function toggleSide() {
  if (window.matchMedia("(max-width: 700px)").matches) { app.classList.toggle("reading"); return; }
  const off = app.classList.toggle("noside");
  try { localStorage.setItem("noside", off ? "1" : ""); } catch (e) { /* not kept */ }
  // The notebook's page as wide as its new room
  if (board.book) requestAnimationFrame(() => { fit(); whole(); });
}

async function pcStart() {
  try { if (localStorage.getItem("noside")) app.classList.add("noside"); } catch (e) { /* shown */ }
  $("hideSide").innerHTML = DI.side;
  $("hideSide").onclick = toggleSide;
  const t = document.createElement("button");
  t.className = "side";
  t.innerHTML = DI.side;
  t.title = "Mostra o nascondi l'elenco delle note";
  t.setAttribute("aria-label", t.title);
  t.onclick = toggleSide;
  $("bar").prepend(t);
  const say = (text, action, run) => {
    $("emptyText").innerHTML = "";
    const p = document.createElement("p");
    p.textContent = text;
    $("emptyText").appendChild(p);
    if (action) { const b = document.createElement("button"); b.className = "pill"; b.textContent = action; b.onclick = run; $("emptyText").appendChild(b); }
  };
  if (!window.showDirectoryPicker) {
    $("side").style.display = "none";
    say("Per aprire e modificare le note da qui serve Chrome o Edge su un computer: questo browser non lascia a una pagina leggere e scrivere in una cartella.");
    return;
  }
  const use = async (handle) => {
    if (pc.root && pc.root !== handle) {
      // Another folder: what was open belongs to the old one
      flush();
      closeBook();
      pc.open = null; shownName = null; dirty = false;
      app.classList.add("none"); app.classList.remove("reading");
    }
    pc.root = handle;
    pc.blobs.clear();
    $("whereName").textContent = "Cartella: " + handle.name;
    // Remembered for the next time; a browser that won't keep it just asks again
    try { await idb("readwrite", (s) => s.put(handle, "root")); } catch (e) { /* asked again next time */ }
    say("Scegli una nota a sinistra, o creane una.");
    await reload();
  };
  const pick = async () => { try { await use(await showDirectoryPicker({ mode: "readwrite", id: "note" })); } catch (e) { /* closed without choosing */ } };
  $("changeDir").onclick = async () => { await pick(); if (pc.root && pc.release) pc.release(); };
  let saved = null;
  try { saved = await idb("readonly", (s) => s.get("root")); } catch (e) { /* first time */ }
  // Still allowed (the browser was told to allow it at every visit): straight in, nothing asked
  if (saved && saved.queryPermission) {
    try { if (await saved.queryPermission({ mode: "readwrite" }) === "granted") { await use(saved); bindButtons(); return; } } catch (e) { /* asked below */ }
  }
  if (saved) {
    // The tree of the last time shows at once; the first touch anywhere (a note, most likely) lets the
    // browser give the folder back, which it allows only on a touch, and then that note opens
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem("tree") || "null"); } catch (e) { cache = null; }
    if (cache && cache.root === saved.name) { pc.tree = cache.tree; pc.pins = cache.pins || []; draw(); }
    $("whereName").textContent = "Cartella: " + saved.name;
    // The button does nothing of its own: any click gives the folder back (see unlock)
    say("Le note sono nella cartella \"" + saved.name + "\". Se il browser chiede l'accesso, scegli \"Consenti a ogni visita\": poi non lo chiede più.", "Apri le note", () => {});
    let open = null;
    pc.gate = new Promise((ok) => { open = ok; });
    // A click, not the press before it: Chrome counts a pen or a finger on the screen as a gesture
    // that may ask for the folder only once it is lifted, and a request without one fails quietly
    let asking = false;
    const unlock = async (e) => {
      if (asking || (e && e.target && e.target.closest && e.target.closest("#veil, #box, #changeDir"))) return;
      if (e && e.type === "keydown" && (e.key === "Escape" || e.key === "Shift" || e.key === "Control" || e.key === "Alt" || e.key === "Meta")) return;
      asking = true;
      let state = "";
      try { state = await saved.requestPermission({ mode: "readwrite" }); } catch (x) { state = "error"; }
      asking = false;
      // No gesture the browser would take: the next click tries again
      if (state === "error") return;
      if (pc.release) pc.release();
      if (state === "granted") await use(saved); else await pick();
      pc.gate = null;
      open();
    };
    // Given back, or another folder chosen instead: nothing more waits for a touch
    pc.release = () => {
      document.removeEventListener("click", unlock, true);
      document.removeEventListener("keydown", unlock, true);
      if (pc.root) { pc.gate = null; open(); }
      pc.release = null;
    };
    document.addEventListener("click", unlock, true);
    document.addEventListener("keydown", unlock, true);
  } else say("Scegli la cartella delle note: quella dove si trova questo file. Viene ricordata.", "Scegli la cartella", pick);
  bindButtons();
}

function bindButtons() {
  $("newNote").onclick = async () => { if (pc.gate) await pc.gate; if (pc.root) newNote([]); };
  $("newBook").onclick = async () => { if (pc.gate) await pc.gate; if (pc.root) newNote([], true); };
  $("newFolder").onclick = async () => { if (pc.gate) await pc.gate; if (pc.root) newFolder([]); };
  // Dropped on the empty part of the tree, or on its title: out of every folder
  for (const zone of [$("tree"), $("sideTop")]) {
    zone.addEventListener("dragover", (e) => { if (pc.drag && (e.target === zone || zone.id === "sideTop")) { e.preventDefault(); $("tree").classList.add("drop"); } });
    zone.addEventListener("dragleave", () => $("tree").classList.remove("drop"));
    zone.addEventListener("drop", (e) => { if (!pc.drag || (e.target !== zone && zone.id !== "sideTop")) return; e.preventDefault(); $("tree").classList.remove("drop"); moveTo(pc.drag, []); });
  }
}

const host = android ? androidHost : pcHost;
try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) { /* older engines keep their own */ }
window.Notes = { show, flush, inserted, goBack, pdfPicked: (path, name) => pdfChosen(path, name) };
if (android) NotesHost.ready(); else pcStart();
</script>
