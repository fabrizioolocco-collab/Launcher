name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y (the tag vX.Y is created on the selected commit)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VER="$INPUT_VERSION"
            VER="${VER#v}"
          else
            VER="${GITHUB_REF_NAME#v}"        # v1.12 -> 1.12
          fi
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+$'; then echo "::error::Version must be X.Y, got '$VER'"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1 && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Tag v$VER already exists"; exit 1
          fi
          MAJOR="${VER%%.*}"
          MINOR="${VER#*.}"
          if [ "$MINOR" -ge 1000 ]; then echo "Minor version must be < 1000"; exit 1; fi
          CODE=$(( MAJOR * 1000 + MINOR ))
          if [ "$CODE" -lt 1 ]; then echo "versionCode must be >= 1 (v0.0 is not allowed)"; exit 1; fi
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VER versionCode=$CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Verify signature and rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then echo "::error::No signed APK produced"; ls -R app/build/outputs/apk; exit 1; fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/MinimaLauncher-${{ steps.version.outputs.tag }}.apk"
          rm -f "$SIGNING_KEYSTORE_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MinimaLauncher ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
